# ── GCP: AI-engine-only compose file ─────────────────────────────────
# Deploy this on a GCP Compute Engine VM (GPU instance).
# The web stack stays on your existing server — only the AI engine moves here.
#
# Pre-requisites on the VM (run setup_gcp_vm.sh first):
#   - Docker + Docker Compose v2
#   - NVIDIA driver 525+
#   - nvidia-container-toolkit
#
# Usage:
#   docker compose -f docker-compose.gcp.yml up -d --build
#
# Required env vars (in .env on the VM):
#   AI_ENGINE_API_KEY   — must match AI_ENGINE_API_KEY on your main server
#   GEMINI_API_KEY      — for Translate feature (optional)

services:
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile.gpu
    image: voxora-ai-gpu
    container_name: voice_ai_gpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - voice_profiles:/app/voice_profiles
      - ai_models:/root/.cache/huggingface
      - tts_models:/root/.local/share/tts
      - builtin_refs:/app/builtin_refs
    environment:
      - COQUI_TOS_AGREED=1
      - AI_ENGINE_API_KEY=${AI_ENGINE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SYNTH_WORKERS=${SYNTH_WORKERS:-2}
      - F5_ALLOW_CPU=0
      # Optional: run a multilingual F5 checkpoint so F5 can speak non-English
      # languages (enables the language picker for F5 in the UI). Leave blank
      # for the default English-first model. Set a model name your f5_tts
      # version knows, or point F5_CKPT_FILE/F5_VOCAB_FILE at a custom checkpoint.
      - F5_MODEL=${F5_MODEL:-}
      - F5_CKPT_FILE=${F5_CKPT_FILE:-}
      - F5_VOCAB_FILE=${F5_VOCAB_FILE:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  voice_profiles:
  ai_models:
  tts_models:
  builtin_refs:
