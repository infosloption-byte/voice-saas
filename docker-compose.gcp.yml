# ── GCP: AI-engine-only compose file ─────────────────────────────────
# Deploy this on a GCP Compute Engine VM (GPU instance).
# The web stack stays on your existing server — only the AI engine moves here.
#
# Pre-requisites on the VM (run setup_gcp_vm.sh first):
#   - Docker + Docker Compose v2
#   - NVIDIA driver 525+
#   - nvidia-container-toolkit
#
# Usage:
#   docker compose -f docker-compose.gcp.yml up -d --build
#
# Required env vars (in .env on the VM):
#   AI_ENGINE_API_KEY   — must match AI_ENGINE_API_KEY on your main server
#   GEMINI_API_KEY      — for Translate feature (optional)
#
# NOTE on Chatterbox: chatterbox-engine is NOT included in this file.
# It's a CPU-friendly, separate service (see ../chatterbox-engine/) that
# has no reason to move to a GPU box — it stays on your main server via
# the primary docker-compose.yml. ai-engine on this GPU VM still reaches
# it over the network: set CHATTERBOX_ENGINE_URL below to your main
# server's reachable address (e.g. http://YOUR_MAIN_SERVER_IP:8100 with
# that port exposed, or a domain if you've put it behind your reverse
# proxy) — the default http://chatterbox-engine:8100 only resolves
# inside the main server's own Docker network, not from this VM.

services:
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile.gpu
    image: voxora-ai-gpu
    container_name: voice_ai_gpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - voice_profiles:/app/voice_profiles
      - ai_models:/root/.cache/huggingface
      - tts_models:/root/.local/share/tts
      - builtin_refs:/app/builtin_refs
    environment:
      - COQUI_TOS_AGREED=1
      - AI_ENGINE_API_KEY=${AI_ENGINE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SYNTH_WORKERS=${SYNTH_WORKERS:-2}
      - F5_ALLOW_CPU=0
      # See the Chatterbox note above — this needs to point back at your
      # main server, not the in-cluster default, when running remotely.
      - CHATTERBOX_ENGINE_URL=${CHATTERBOX_ENGINE_URL:-http://chatterbox-engine:8100}
      # Optional: run a different-language F5 checkpoint. F5 has no language id;
      # each checkpoint speaks the language(s) it was trained on. Leave blank for
      # the default English model. Example — Spanish (jpgallegoar/F5-Spanish):
      #   F5_CKPT_FILE=hf://jpgallegoar/F5-Spanish/model_1250000.safetensors
      #   F5_VOCAB_FILE=hf://jpgallegoar/F5-Spanish/vocab.txt
      #   F5_LANGUAGES=es
      # F5_LANGUAGES tells the UI which languages to offer for F5.
      - F5_MODEL=${F5_MODEL:-}
      - F5_CKPT_FILE=${F5_CKPT_FILE:-}
      - F5_VOCAB_FILE=${F5_VOCAB_FILE:-}
      - F5_LANGUAGES=${F5_LANGUAGES:-en}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  voice_profiles:
  ai_models:
  tts_models:
  builtin_refs:
