services:
  #ngnix
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
       - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    networks:
      - voice-network

  # Laravel Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice_backend
    ports:
    - "8080:9000"
    command: php artisan serve --host=0.0.0.0 --port=8080
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=voice_saas
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - AI_ENGINE_URL=http://ai-engine:8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - voice-network

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - voice-network

  # Python AI Engine (FastAPI)
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: voice_ai
    ports:
      - "8000:8000"
    volumes:
      - ./ai-engine:/app
      - ai_models:/root/.cache/huggingface
      - tts_models:/root/.local/share/tts  # Add this line!
    environment:
      - COQUI_TOS_AGREED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - voice-network

  # Infrastructure
  db:
    image: mysql:8.0
    container_name: voice_db
    environment:
      MYSQL_DATABASE: voice_saas
      MYSQL_ROOT_PASSWORD: password
    networks:
      - voice-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: voice_redis
    networks:
      - voice-network

networks:
  voice-network:
    driver: bridge

volumes:
  ai_models:
  tts_models: