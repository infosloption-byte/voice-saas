services:
  #ngnix
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    networks:
      - voice-network

  # Laravel Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice_backend
    restart: unless-stopped
    ports:
    - "127.0.0.1:8083:9000"
    command: php artisan serve --host=0.0.0.0 --port=8080
    volumes:
      - ./backend:/var/www/html
      - ./backups:/backups
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql_shared
      - DB_PORT=3306
      - DB_DATABASE=voice_saas
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - AI_ENGINE_URL=http://ai-engine:8000
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - BACKUP_DIR=/backups
      - AUDIO_DISK=${AUDIO_DISK:-local}
      - AUDIO_PRUNE_DAYS=${AUDIO_PRUNE_DAYS:-90}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_BUCKET=${AWS_BUCKET:-}
    networks:
      - voice-network
      - shared_net

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://usevoxora.online/api}
        - VITE_ENGINE_URL=${VITE_ENGINE_URL:-https://usevoxora.online/api/engine}
        - VITE_ADMIN_EMAIL=${VITE_ADMIN_EMAIL:-}
        - VITE_PAYPAL_CLIENT_ID=${VITE_PAYPAL_CLIENT_ID:-}
        - VITE_PAYPAL_PLAN_STARTER=${VITE_PAYPAL_PLAN_STARTER:-}
        - VITE_PAYPAL_PLAN_PRO=${VITE_PAYPAL_PLAN_PRO:-}
    container_name: voice_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - voice-network

  # Laravel Queue Worker
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=3
    volumes:
      - ./backend:/var/www/html
      - ./backups:/backups
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql_shared
      - DB_PORT=3306
      - DB_DATABASE=voice_saas
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - AI_ENGINE_URL=http://ai-engine:8000
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - BACKUP_DIR=/backups
      - AUDIO_DISK=${AUDIO_DISK:-local}
      - AUDIO_PRUNE_DAYS=${AUDIO_PRUNE_DAYS:-90}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_BUCKET=${AWS_BUCKET:-}
    networks:
      - voice-network
      - shared_net

  # Laravel Scheduler
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./backend:/var/www/html
      - ./backups:/backups
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql_shared
      - DB_PORT=3306
      - DB_DATABASE=voice_saas
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - BACKUP_DIR=/backups
      - AUDIO_DISK=${AUDIO_DISK:-local}
      - AUDIO_PRUNE_DAYS=${AUDIO_PRUNE_DAYS:-90}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_BUCKET=${AWS_BUCKET:-}
    networks:
      - voice-network
      - shared_net

  # Python AI Engine (FastAPI) — XTTS v2, runs locally on this EC2
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: voice_ai
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./ai-engine:/app
      - voice_profiles:/app/voice_profiles
      - ai_models:/root/.cache/huggingface
      - tts_models:/root/.local/share/tts
      - builtin_refs:/app/builtin_refs
    environment:
      - COQUI_TOS_AGREED=1
      - AI_ENGINE_API_KEY=${AI_ENGINE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SYNTH_WORKERS=${SYNTH_WORKERS:-1}
      - CHATTERBOX_ENGINE_URL=${CHATTERBOX_ENGINE_URL:-http://chatterbox-engine:8100}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_BUCKET=${AWS_BUCKET:-}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - voice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Chatterbox (Resemble AI, MIT-licensed) — separate service from
  # ai-engine because it hard-pins torch==2.6.0 + transformers==4.46.3,
  # which is unresolvable against ai-engine's XTTS pins (torch==2.2.2+cpu,
  # transformers==4.36.2). ai-engine proxies to this container over HTTP
  # instead of loading Chatterbox in-process. Not required for XTTS/F5 to
  # keep working — ai-engine degrades gracefully if this is unreachable.
  #
  # OPT-IN via profile — NOT started by a plain `docker compose up`.
  # Two ways to run Chatterbox:
  #   (a) LOCAL, same box as everything else — only if you have RAM to
  #       spare (XTTS + Whisper + Chatterbox all loaded together is
  #       genuinely heavy on a small instance and can cause OOM restart
  #       loops). Start it explicitly:
  #         docker compose --profile local-chatterbox up -d
  #   (b) REMOTE, on its own EC2/GPU box — recommended if RAM is tight.
  #       Deploy chatterbox-engine/ alone there (see
  #       docker-compose.chatterbox-remote.yml), then set
  #       CHATTERBOX_ENGINE_URL in this server's .env to that box's
  #       reachable address and DON'T start this local profile at all.
  chatterbox-engine:
    profiles: ["local-chatterbox"]
    build:
      context: ./chatterbox-engine
      dockerfile: Dockerfile
    container_name: voice_chatterbox
    restart: unless-stopped
    expose:
      - "8100"
    volumes:
      - chatterbox_models:/root/.cache/huggingface
    environment:
      - CHATTERBOX_ENGINE_API_KEY=${AI_ENGINE_API_KEY:-}
    command: uvicorn main:app --host 0.0.0.0 --port 8100
    networks:
      - voice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

  redis:
    image: redis:alpine
    container_name: voice_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - voice-network

networks:
  voice-network:
    driver: bridge
  shared_net:
    external: true

volumes:
  voice_profiles:
  ai_models:
  tts_models:
  builtin_refs:
  chatterbox_models:
  redis_data:
