services:
  #ngnix
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    networks:
      - voice-network

  # Laravel Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice_backend
    restart: unless-stopped
    ports:
    - "127.0.0.1:8083:9000"
    command: php artisan serve --host=0.0.0.0 --port=8080
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=172.17.0.1
      - DB_PORT=3306
      - DB_DATABASE=voice_saas
      - DB_USERNAME=root
      - DB_PASSWORD=StrongRootPass123!
      - REDIS_HOST=redis
      - AI_ENGINE_URL=http://ai-engine:8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - voice-network

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://usevoxora.online/api}
        - VITE_ENGINE_URL=${VITE_ENGINE_URL:-https://usevoxora.online/ai}
        - VITE_ENGINE_API_KEY=${VITE_ENGINE_API_KEY:-}
        - VITE_PAYPAL_CLIENT_ID=${VITE_PAYPAL_CLIENT_ID:-}
    container_name: voice_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - voice-network

  # Python AI Engine (FastAPI)
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: voice_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ai-engine:/app
      - voice_profiles:/app/voice_profiles
      - ai_models:/root/.cache/huggingface
      - tts_models:/root/.local/share/tts  # Add this line!
    environment:
      - COQUI_TOS_AGREED=1
      - AI_ENGINE_API_KEY=${AI_ENGINE_API_KEY:-}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - voice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s  # models take time to load

  # Infrastructure
  db:
    image: mysql:8.0
    container_name: voice_db
    environment:
      MYSQL_DATABASE: voice_saas
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - voice-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: voice_redis
    networks:
      - voice-network

networks:
  voice-network:
    driver: bridge

volumes:
  voice_profiles:
  ai_models:
  tts_models: