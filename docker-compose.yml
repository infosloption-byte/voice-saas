services:
  #ngnix
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    networks:
      - voice-network

  # Laravel Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice_backend
    restart: unless-stopped
    ports:
    - "127.0.0.1:8083:9000"
    command: php artisan serve --host=0.0.0.0 --port=8080
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=172.17.0.1
      - DB_PORT=3306
      - DB_DATABASE=voice_saas
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - AI_ENGINE_URL=http://ai-engine:8000
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      # Audio storage — leave AUDIO_DISK=local until S3 is provisioned
      - AUDIO_DISK=${AUDIO_DISK:-local}
      - AUDIO_PRUNE_DAYS=${AUDIO_PRUNE_DAYS:-90}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_BUCKET=${AWS_BUCKET:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - voice-network

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://usevoxora.online/api}
        # Engine is reached via the backend proxy now; this stays only to satisfy
        # the legacy fallback in api.ts. The engine API key is NO LONGER built
        # into the frontend bundle — it lives server-side on the backend.
        - VITE_ENGINE_URL=${VITE_ENGINE_URL:-https://usevoxora.online/api/engine}
        - VITE_ADMIN_EMAIL=${VITE_ADMIN_EMAIL:-}
        - VITE_PAYPAL_CLIENT_ID=${VITE_PAYPAL_CLIENT_ID:-}
        - VITE_PAYPAL_PLAN_STARTER=${VITE_PAYPAL_PLAN_STARTER:-}
        - VITE_PAYPAL_PLAN_PRO=${VITE_PAYPAL_PLAN_PRO:-}
    container_name: voice_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - voice-network

  # Python AI Engine (FastAPI)
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: voice_ai
    restart: unless-stopped
    # No public ports: the engine is reachable only on the internal Docker
    # network (the backend calls it at http://ai-engine:8000). Exposing it to
    # the host reopens free-GPU / IDOR holes, since the engine key alone is not
    # a sufficient authorization boundary.
    expose:
      - "8000"
    volumes:
      - ./ai-engine:/app
      - voice_profiles:/app/voice_profiles
      - ai_models:/root/.cache/huggingface
      - tts_models:/root/.local/share/tts  # Add this line!
      - builtin_refs:/app/builtin_refs
    environment:
      - COQUI_TOS_AGREED=1
      - AI_ENGINE_API_KEY=${AI_ENGINE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Concurrent synthesis jobs. Keep at 1 on CPU (serializes heavy work,
      # avoids OOM); raise on a GPU host with headroom.
      - SYNTH_WORKERS=${SYNTH_WORKERS:-1}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - voice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s  # models take time to load

  # Infrastructure
  db:
    image: mysql:8.0
    container_name: voice_db
    environment:
      MYSQL_DATABASE: voice_saas
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - voice-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: voice_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - voice-network

networks:
  voice-network:
    driver: bridge

volumes:
  voice_profiles:
  ai_models:
  tts_models:
  builtin_refs:
  mysql_data:
  redis_data: