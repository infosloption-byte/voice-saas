# ── Admin subdomain: admin.usevoxora.online ───────────────────────
server {
    listen 80;
    server_name admin.usevoxora.online;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # All traffic to the same SPA — JS detects admin.* hostname and
    # renders AdminApp instead of the regular app
    location / {
        set $frontend frontend:3000;
        proxy_pass         http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $http_connection;
        proxy_set_header   Host       $host;
        proxy_read_timeout 30s;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        set $backend backend:8080;
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    location /sanctum/ {
        set $backend backend:8080;
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# ── Main app: usevoxora.online ────────────────────────────────────
server {
    listen 80;
    server_name usevoxora.online www.usevoxora.online;

    # Use Docker's embedded DNS so nginx re-resolves service names
    # after container recreation instead of caching stale IPs.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $frontend frontend:3000;
        proxy_pass         http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $http_connection;
        proxy_set_header   Host       $host;
        proxy_read_timeout 30s;

        # Content-Security-Policy for the SPA document. 'unsafe-inline' is
        # required because the React build uses inline styles and Vite injects
        # inline scripts; blob:/data: cover generated audio and waveform images;
        # PayPal origins cover the checkout SDK. Tighten with nonces later.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.paypal.com https://www.paypalobjects.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://api-m.paypal.com https://api-m.sandbox.paypal.com https://www.paypal.com; frame-src https://www.paypal.com https://www.sandbox.paypal.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        set $backend backend:8080;
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Long enough for synthesis/clone-voice now that engine calls are
        # proxied through the backend under /api/engine/*.
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    location /sanctum/ {
        set $backend backend:8080;
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # NOTE: the AI engine is intentionally NOT exposed publicly. The frontend
    # talks to it only through the Laravel backend (/api/engine/*), which
    # injects the engine API key server-side and enforces auth + quota. Do not
    # re-add a public /ai/ location — doing so reopens free-GPU and IDOR holes.
}
