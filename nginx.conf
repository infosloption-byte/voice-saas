server {
    listen 80;
    server_name usevoxora.online www.usevoxora.online;

    # Use Docker's embedded DNS so nginx re-resolves service names
    # after container recreation instead of caching stale IPs.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $frontend frontend:3000;
        proxy_pass         http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $http_connection;
        proxy_set_header   Host       $host;
        proxy_read_timeout 30s;
    }

    location /api/ {
        set $backend backend:8080;
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }

    location /sanctum/ {
        set $backend backend:8080;
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /ai/ {
        set $ai ai-engine:8000;
        rewrite            ^/ai/(.*)$ /$1 break;
        proxy_pass         http://$ai;
        proxy_set_header   Host              $host;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }
}
